project_id = "template-next-supabase"

[api]
enabled = true
port = 54321
# Only schemas listed here are reachable through the Data API. Nothing in this
# template queries Supabase from a browser, so if you want to close that door
# entirely, set this to an empty list and rely solely on the server DAL.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
